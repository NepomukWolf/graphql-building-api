[project]
name = "graphql-building-api"
version = "0.1.0"
description = "Prototype GraphQL API for simplified access to IFC building models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ariadne>=0.26.2",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "ifcopenshell>=0.8.3.post2",
    "networkx>=3.5",
    "pyglet<2",
    "python-pptx>=1.0.2",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "trimesh>=4.9.0",
]

[tool.pyright]
typeCheckingMode = "basic"
