[project]
name = "graphql-building-api"
version = "0.1.0"
description = "Prototype GraphQL API for simplified access to IFC building models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ariadne>=0.26.2",
    "fastapi>=0.116",
    "ifcopenshell>=0.8.3.post2",
    "networkx>=3.5",
    "pyglet<2",
    "python-pptx>=1.0.2",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "trimesh>=4.9.0",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphql_building_api*"]

[tool.setuptools.package-data]
graphql_building_api = ["gql/*.graphql", "extensions/**/*.graphql"]

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0"]
