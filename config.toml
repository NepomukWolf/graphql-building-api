default_model = "2026-SampleModel"
default_port = 8000

[geometry]
# file | model
default_source = "file"

# Whether GraphQL source: FILE/MODEL is honored.
respect_client_source = true

# Whether geometry may be generated dynamically from the loaded IFC model.
allow_dynamic_generation = true

# Whether dynamically generated geometry is written to graphql_building_api/static/models.
cache_generated = false

[extensions]
# Extension directory names that should not be loaded into the GraphQL schema.
disabled = []
