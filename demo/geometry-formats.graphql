query GeometryFormatsDemo {
  # Replace the element id with one from the URL-selected model.
  elements(where: { id: "0Czv28JAHDuepx33rj$lAZ" }) {
    guid
    name
    type
    wkt: geometry(format: WKT, source: MODEL) {
      payload
      encoding
      extension
      contentType
    }
    gltf: geometry(format: GLTF, source: MODEL) {
      payload
      encoding
      extension
      contentType
    }
  }
}
