query GeometryFormatsDemo {
  # Replace example-model and the element id with values from your local model.
  model(name: "example-model") {
    elements(where: { id: "0Czv28JAHDuepx33rj$lAZ" }) {
      guid
      name
      type
      wkt: geometry(format: WKT, source: MODEL) {
        payload
        encoding
        extension
        contentType
      }
      gltf: geometry(format: GLTF, source: MODEL) {
        payload
        encoding
        extension
        contentType
      }
    }
  }
}
