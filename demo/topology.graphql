query ElementTopologyDemo {
  # Replace the element id with one from the URL-selected model.
  elements(where: { id: "0Czv28JAHDuepx33rj$lAZ" }) {
    guid
    name
    type
    intersects(where: { type: "Wall" }) {
      guid
      name
      type
    }
    adjacent(where: { type: "Column" }) {
      guid
      name
      type
    }
  }
}
