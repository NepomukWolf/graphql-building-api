query ExternalWallSelectorDemo {
  elements(
    where: {
      type: "Wall"
      filters: [EXTERNAL]
      selector: "IfcWall"
    }
  ) {
    guid
    name
    type
    dataSheetURL
    properties(pset: "Pset_WallCommon") {
      name
      value
      pset
    }
    geometry(format: OBJ) {
      url
      extension
      contentType
    }
  }
}
