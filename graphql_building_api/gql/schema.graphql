type Query {
  model(name: String): Model
  models: [ModelInfo!]!
}

type Mutation {
  updateProperty(input: UpdatePropertyInput!): BuildingElement
  patchProperties(input: PatchPropertiesInput!): BuildingElement
}

enum ModelChangeKind { CREATED UPDATED REPLACED DELETED }
enum ModelChangeSource { FILE_API BUILDING_GRAPHQL IFC_GRAPHQL }
type ModelChangeEvent {
  modelId: ID!
  revision: Int!
  kind: ModelChangeKind!
  source: ModelChangeSource!
}
type Subscription { modelChanged: ModelChangeEvent! }

input UpdatePropertyInput {
  model: String
  guid: ID!
  propertySet: String!
  property: String!
  value: JSON!
}

"""
Input for applying a property-set merge patch to an IFC entity.

`patch` is an object whose top-level keys are property-set names. An object
value creates or patches that property set, while `null` deletes it. Within a
property-set object, non-null values create or update properties and `null`
deletes properties.

For example:

```
{
  "Pset_WallCommon": {
    "IsExternal": true,
    "Reference": null
  },
  "Obsolete_PropertySet": null
}
```
"""
input PatchPropertiesInput {
  model: String
  guid: ID!
  includeInherited: Boolean! = false
  patch: JSON!
}

"""
Loaded IFC model entry point.
"""
type Model {
  name: String!
  building: Building
  storeys(where: ZoneQuery): [Storey!]!
  spaces(where: ZoneQuery): [Space!]!
  elements(where: ElementQuery): [BuildingElement!]!
}

"""
Available IFC model.
"""
type ModelInfo {
  name: String!
  isDefault: Boolean!
}

"""
Arbitrary JSON value used for IFC property values.
"""
scalar JSON

"""
Curated semantic filters for IFC building elements.
"""
enum ElementFilter {
  """
  Elements marked external, commonly through an IsExternal property.
  """
  EXTERNAL

  INTERNAL

  """
  Elements marked load bearing, commonly through a LoadBearing property.
  """
  LOAD_BEARING

  FIRE_RATED
}

"""
Structured zone selection input.
"""
input ZoneQuery {
  search: String
}

"""
Structured element selection input.

`type` accepts both friendly names such as "Wall" and real IFC names such as
"IfcWall". `search` is intended for broad text search. `filters` applies
curated semantic property filters. `selector` accepts a raw IfcOpenShell selector
query and is scoped to the current candidate set. All constraints are combined
with AND semantics.
"""
input ElementQuery {
  id: ID
  type: String
  search: String
  filters: [ElementFilter!]
  selector: String
}

#--------- Spatial Structure ---------#
"""
Common interface for spatial IFC entities.
"""
interface Zone {
  id: ID!
  name: String
  geometry(
    format: GeometryFormat = OBJ
    """
    Preferred geometry source. The server may ignore this value depending on
    its configuration.
    """
    source: GeometrySource
  ): Geometry
  contains: [Zone]
  elements(where: ElementQuery): [BuildingElement]
  partOf: [Zone]
  intersects(where: ZoneQuery): [Zone]
  adjacent(where: ZoneQuery): [Zone]
}

"""
The root building zone from the IFC model.
"""
type Building implements Zone {
  id: ID!
  name: String
  geometry(
    format: GeometryFormat = OBJ
    """
    Preferred geometry source. The server may ignore this value depending on
    its configuration.
    """
    source: GeometrySource
  ): Geometry
  contains: [Zone]
  elements(where: ElementQuery): [BuildingElement]
  partOf: [Zone]
  intersects(where: ZoneQuery): [Zone]
  adjacent(where: ZoneQuery): [Zone]
  storeys: [Storey]
  spaces: [Space]
}

"""
A building storey zone from the IFC spatial hierarchy.
"""
type Storey implements Zone {
  id: ID!
  name: String
  geometry(
    format: GeometryFormat = OBJ
    """
    Preferred geometry source. The server may ignore this value depending on
    its configuration.
    """
    source: GeometrySource
  ): Geometry
  contains: [Zone]
  elements(where: ElementQuery): [BuildingElement]
  partOf: [Zone]
  intersects(where: ZoneQuery): [Zone]
  adjacent(where: ZoneQuery): [Zone]
  spaces: [Space]
}

"""
A space zone from the IFC spatial hierarchy.
"""
type Space implements Zone {
  id: ID!
  name: String
  geometry(
    format: GeometryFormat = OBJ
    """
    Preferred geometry source. The server may ignore this value depending on
    its configuration.
    """
    source: GeometrySource
  ): Geometry
  elements(where: ElementQuery): [BuildingElement]
  contains: [Zone]
  partOf: [Zone]
  intersects(where: ZoneQuery): [Zone]
  adjacent(where: ZoneQuery): [Zone]
}

#--------- Elements ---------
"""
Physical or logical IFC building element, such as a wall, slab, door, window,
or beam.
"""
type BuildingElement {
  geometry(
    format: GeometryFormat = OBJ
    """
    Preferred geometry source. The server may ignore this value depending on
    its configuration.
    """
    source: GeometrySource
  ): Geometry
  guid: ID!
  name: String
  type: String
  contains: [BuildingElement]
  partOf: [BuildingElement]
  intersects(where: ElementQuery): [BuildingElement]
  adjacent(where: ElementQuery): [BuildingElement]
  properties(
    """Exact property-set name to include."""
    pset: String
    """Exact property name to include."""
    name: String
  ): [Property]
  materials: MaterialAssignment
}

"""
IFC property value with its property set name.
"""
type Property {
  name: String
  value: JSON
  pset: String
}

"""
Supported geometry serialization formats.
"""
enum GeometryFormat {
  OBJ
  GLB
  GLTF
  STL
  STL_ASCII
  PLY
  PLY_ASCII
  OFF
  WKT
  BREP
}

"""
How geometry payload strings are encoded in GraphQL responses.
"""
enum GeometryEncoding {
  PLAIN
  BASE64
}

"""
Preferred source for resolving geometry.

This is a client preference. The server may ignore it depending on runtime
configuration.
"""
enum GeometrySource {
  """
  Prefer geometry from pre-generated files.
  """
  FILE

  """
  Prefer geometry generated from the loaded IFC model.
  """
  MODEL
}

#--------- Geometry ---------#
"""
Geometry representation for one IFC entity.

Clients can request a static URL, inline payload, or both. Whether geometry is
read from files, generated from the model, or cached is controlled by server
configuration and the optional source argument on the parent geometry field.
"""
type Geometry {
  url: String
  payload: String
  encoding: GeometryEncoding
  format: GeometryFormat
  extension: String
  contentType: String
}

type Material {
  id: ID!
  name: String!
  category: String
  properties(
    """Exact material property-set name to include."""
    pset: String
    """Exact material property name to include."""
    name: String
  ): [Property]!
}

type MaterialLayer {
  material: Material
  thickness: Float
}

type MaterialLayerSet {
  layers: [MaterialLayer!]!
}

union MaterialAssignment = Material | MaterialLayerSet
